server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy same-origin;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {proxy_pass http://ingress-api:3000; proxy_set_header Host $host; proxy_set_header Origin $http_origin; proxy_read_timeout 15s;}
 location / {try_files $uri $uri/ /index.html;}
}
